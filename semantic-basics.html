<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Semantic Basics</title>
</head>
<body>
    <header>
        <h1>Semantic Basics</h1>
        <!-- only 1 h1 tag per page -->
    </header>
    <nav>
        <h2>Main Navigation</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
        </ul>
    </nav>
    <main>
        <!-- Semantic grouping of content -->
        <section>
            <h2>Semantic Elements</h2>
            <p>Lorem ipsum</p>
            <!-- dont leave sections untitled -->
        </section>
        <figcaption>
            <h2>Hipster Image</h2>
            <figure>
                <img src="img/hipster.jpg" alt="hipster-image" width="400" height="300">
                <figcaption>Hipster Image</figcaption>
            </figure>
        </figcaption>
        <aside>
            <h2>Additional info</h2>
            <p>This is additional info text </p>
        </aside>
    </main>
    <footer>
        <p>designed by Aidan</p>
        <address>aico7866@colorado.edu</address>
    </footer>
</body>
</html>
